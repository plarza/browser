# The iPhone app. `xcodegen` turns this into Browser.xcodeproj and
# Info.plist (neither checked in); iOS/build.sh does that and builds.
name: Browser
options:
  bundleIdPrefix: network.aza
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: H5A6B4L9W8
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  # Every privacy rule lives here; the Mac's shell stands on the same sources.
  BrowserKit:
    type: framework
    platform: iOS
    sources:
      - path: ../BrowserKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.browser.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Browser:
    type: application
    platform: iOS
    dependencies:
      - target: BrowserKit
    sources:
      - path: App
      # The logo, by name, for BrowserKit: its own pages' icon.
      - path: Assets.xcassets
      - path: ../release/Browser.icon
        buildPhase: resources
      - path: ../release/morning.webp
        buildPhase: resources
      - path: ../release/engines
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Browser
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # ProMotion: animations at up to 120 Hz, not capped at 60.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: A website asked for the camera. Browser asks you each time.
        NSMicrophoneUsageDescription: A website asked for the microphone. Browser asks you each time.
        NSPhotoLibraryAddUsageDescription: Saving an image from a page.
        # Downloads show in the Files app, under Browser.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Only HTTPS from the system's own stack: nothing for export rules to cover.
        ITSAppUsesNonExemptEncryption: false
        # Links from other apps.
        CFBundleURLTypes:
          - CFBundleURLName: Web address
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aza.browser
        PRODUCT_NAME: Browser
        ASSETCATALOG_COMPILER_APPICON_NAME: Browser
